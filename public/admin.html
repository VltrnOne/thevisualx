<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - VISUALX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #111111;
            --bg-card: rgba(17, 17, 17, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-muted: #555555;
            --vltrn-primary: #7c3aed;
            --vltrn-secondary: #a855f7;
            --vltrn-glow: rgba(124, 58, 237, 0.4);
            --vltrn-gradient: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #c084fc 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --error-color: #ef4444;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.5;
        }

        .admin-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
        }

        /* Header */
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .logo a {
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo .v {
            background: var(--vltrn-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.4);
            border-radius: 100px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--vltrn-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--vltrn-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
        }

        .btn-logout {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-logout:hover {
            border-color: var(--error-color);
            color: var(--error-color);
        }

        /* Main Content */
        .admin-main {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 40px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(124, 58, 237, 0.3);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 600;
            background: var(--vltrn-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Users Table */
        .table-container {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .table-title {
            font-size: 18px;
            font-weight: 500;
        }

        .search-input {
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            width: 250px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--vltrn-primary);
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th {
            text-align: left;
            padding: 14px 24px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
        }

        .users-table td {
            padding: 16px 24px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .users-table tr:hover td {
            background: rgba(124, 58, 237, 0.05);
        }

        .users-table tr:last-child td {
            border-bottom: none;
        }

        .user-email {
            font-weight: 500;
        }

        .user-name {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .role-admin {
            background: rgba(124, 58, 237, 0.2);
            color: var(--vltrn-secondary);
            border: 1px solid rgba(124, 58, 237, 0.4);
        }

        .role-user {
            background: rgba(136, 136, 136, 0.1);
            color: var(--text-secondary);
            border: 1px solid rgba(136, 136, 136, 0.2);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-active .status-dot {
            background: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .status-inactive .status-dot {
            background: var(--error-color);
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            border: 1px solid;
        }

        .btn-role {
            background: transparent;
            border-color: var(--vltrn-primary);
            color: var(--vltrn-secondary);
        }

        .btn-role:hover {
            background: rgba(124, 58, 237, 0.2);
        }

        .btn-toggle {
            background: transparent;
            border-color: var(--warning-color);
            color: var(--warning-color);
        }

        .btn-toggle:hover {
            background: rgba(245, 158, 11, 0.2);
        }

        .btn-delete {
            background: transparent;
            border-color: var(--error-color);
            color: var(--error-color);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .timestamp {
            color: var(--text-muted);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-top-color: var(--vltrn-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-header {
                padding: 16px 20px;
                flex-direction: column;
                gap: 16px;
            }

            .admin-main {
                padding: 20px;
            }

            .table-header {
                flex-direction: column;
                gap: 16px;
            }

            .search-input {
                width: 100%;
            }

            .users-table {
                display: block;
                overflow-x: auto;
            }

            .actions-cell {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div class="admin-container">
        <header class="admin-header">
            <div class="header-left">
                <div class="logo">
                    <a href="/"><span class="v">V</span>ISUALX</a>
                </div>
                <div class="admin-badge">Admin Panel</div>
            </div>
            <div class="header-right">
                <div class="admin-user">
                    <div class="user-avatar" id="userAvatar">A</div>
                    <span id="userEmail">admin@visualx.com</span>
                </div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <main class="admin-main">
            <h1 class="page-title">User Management</h1>
            <p class="page-subtitle">Manage all registered users and their permissions</p>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-value" id="statTotal">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Administrators</div>
                    <div class="stat-value" id="statAdmins">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Users</div>
                    <div class="stat-value" id="statActive">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">New Today</div>
                    <div class="stat-value" id="statToday">-</div>
                </div>
            </div>

            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">All Users</h2>
                    <input type="text" class="search-input" placeholder="Search by email..." id="searchInput" oninput="filterUsers()">
                </div>
                <div id="usersTableContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading users...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let allUsers = [];
        const token = localStorage.getItem('adminToken');

        // Check authentication
        if (!token) {
            window.location.href = '/admin-login';
        }

        // Verify admin access
        fetch('/api/admin/verify', {
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
            if (!data.valid || data.user?.role !== 'admin') {
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminUser');
                window.location.href = '/admin-login';
            } else {
                document.getElementById('userEmail').textContent = data.user.email;
                document.getElementById('userAvatar').textContent = data.user.email[0].toUpperCase();
                loadData();
            }
        })
        .catch(() => {
            window.location.href = '/admin-login';
        });

        function loadData() {
            loadStats();
            loadUsers();
        }

        function loadStats() {
            fetch('/api/admin/stats', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('statTotal').textContent = data.total || 0;
                document.getElementById('statAdmins').textContent = data.admins || 0;
                document.getElementById('statActive').textContent = data.active || 0;
                document.getElementById('statToday').textContent = data.today || 0;
            });
        }

        function loadUsers() {
            fetch('/api/admin/users', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
                allUsers = data.users || [];
                renderUsers(allUsers);
            });
        }

        function renderUsers(users) {
            const container = document.getElementById('usersTableContainer');

            if (users.length === 0) {
                container.innerHTML = '<div class="empty-state">No users found</div>';
                return;
            }

            let html = `
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Last Login</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            users.forEach(user => {
                const createdDate = user.created_at ? new Date(user.created_at).toLocaleDateString() : '-';
                const lastLogin = user.last_login ? new Date(user.last_login).toLocaleDateString() : 'Never';
                const isActive = user.is_active === 1;
                const isAdmin = user.role === 'admin';

                html += `
                    <tr>
                        <td>
                            <div class="user-email">${user.email}</div>
                            ${user.name ? `<div class="user-name">${user.name}</div>` : ''}
                        </td>
                        <td>
                            <span class="role-badge ${isAdmin ? 'role-admin' : 'role-user'}">
                                ${user.role || 'user'}
                            </span>
                        </td>
                        <td>
                            <span class="status-badge ${isActive ? 'status-active' : 'status-inactive'}">
                                <span class="status-dot"></span>
                                ${isActive ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td class="timestamp">${createdDate}</td>
                        <td class="timestamp">${lastLogin}</td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn-action btn-role" onclick="toggleRole(${user.id}, '${user.role}')">
                                    ${isAdmin ? 'Demote' : 'Promote'}
                                </button>
                                <button class="btn-action btn-toggle" onclick="toggleActive(${user.id}, ${isActive})">
                                    ${isActive ? 'Deactivate' : 'Activate'}
                                </button>
                                <button class="btn-action btn-delete" onclick="deleteUser(${user.id}, '${user.email}')">
                                    Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(u => u.email.toLowerCase().includes(query));
            renderUsers(filtered);
        }

        function toggleRole(userId, currentRole) {
            const newRole = currentRole === 'admin' ? 'user' : 'admin';
            if (!confirm(`Change user role to ${newRole}?`)) return;

            fetch(`/api/admin/users/${userId}/role`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ role: newRole })
            })
            .then(res => res.json())
            .then(() => loadData());
        }

        function toggleActive(userId, isActive) {
            const action = isActive ? 'deactivate' : 'activate';
            if (!confirm(`Are you sure you want to ${action} this user?`)) return;

            fetch(`/api/admin/users/${userId}/toggle`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ is_active: !isActive })
            })
            .then(res => res.json())
            .then(() => loadData());
        }

        function deleteUser(userId, email) {
            if (!confirm(`Are you sure you want to permanently delete ${email}?`)) return;

            fetch(`/api/admin/users/${userId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    loadData();
                }
            });
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = '/admin-login';
        }

        // WebGL Background (subtle)
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const geometry = new THREE.BufferGeometry();
        const count = 800;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        for(let i = 0; i < count * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 25;
            positions[i + 1] = (Math.random() - 0.5) * 25;
            positions[i + 2] = (Math.random() - 0.5) * 25;
            colors[i] = 0.48;
            colors[i + 1] = 0.22;
            colors[i + 2] = 0.93;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.02,
            vertexColors: true,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);
        camera.position.z = 8;

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.0002;
            particles.rotation.x += 0.0001;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
